kind = "web"
previewPath = "/"
title = "HERBORA AI"
description = "An educational Ayurvedic herbal intelligence platform for exploring botanical profiles, image-based demo identification, structured search, similarity recommendations, and referenced evidence and safety information."
version = "1.0.0"
id = "artifacts/herbora-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25906

[services.development]
run = "pnpm --filter @workspace/herbora-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/herbora-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/herbora-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25906"
BASE_PATH = "/"
